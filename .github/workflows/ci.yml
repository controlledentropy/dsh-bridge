name: tests

# The suite is offline by design: no dsh instance, no network, no model quota.
#
# Windows only, deliberately - but no longer for the reason it used to say. The cwd guard now scans by the
# FLAVOUR OF THE SESSION CWD rather than by the host platform, so posix briefs are classified on Windows
# too and the posix cases in tests/contract.test.mjs run everywhere (they inject the existence probe, so
# nothing touches a real /etc).
#
# What still keeps this on Windows is the FIXTURES, not the classifier: several tests build workspace
# paths with path.join and then append Windows-shaped relative parts, and the launcher tests assert
# PATHEXT ordering (C:\b\pnpm.cmd beats C:\b\pnpm.ps1) which is a Windows-only truth. Running those on
# ubuntu would report fixture shape as a defect. Turning on an ubuntu leg means making the fixtures
# flavour-aware first; until then a red ubuntu job would be noise, not a signal.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # A red check that nobody can read is not a signal: downloading job logs needs repo admin, so the
      # failing test names also go out as check annotations, readable through the public Checks API.
      - name: npm test
        shell: bash
        run: |
          set +e
          npm test > test.log 2>&1
          code=$?
          cat test.log
          if [ "$code" -ne 0 ]; then
            echo "::error::npm test exited $code on ${{ matrix.os }}, node ${{ matrix.node }}"
            grep -E "^not ok|^# fail" test.log | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          exit "$code"
