name: tests

# The suite is offline by design: no dsh instance, no network, no model quota.
#
# Windows only, deliberately. The suite asserts the cwd guard's drive-letter semantics (`D:\x\report.md`
# is outside `D:\work\p`; `C:\b\pnpm.cmd` beats `C:\b\pnpm.ps1` the way PATHEXT does) because that is the
# surface this bridge is used on. On a Linux runner those same cases fail for a true reason - the guard
# does not understand posix paths - so an ubuntu job here would be reporting a portability claim nobody
# asked for rather than a defect. Supporting posix paths is a separate piece of work, not a CI matrix row.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # A red check that nobody can read is not a signal: downloading job logs needs repo admin, so the
      # failing test names also go out as check annotations, readable through the public Checks API.
      - name: npm test
        shell: bash
        run: |
          set +e
          npm test > test.log 2>&1
          code=$?
          cat test.log
          if [ "$code" -ne 0 ]; then
            echo "::error::npm test exited $code on ${{ matrix.os }}, node ${{ matrix.node }}"
            grep -E "^not ok|^# fail" test.log | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          exit "$code"
