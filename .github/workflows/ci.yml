name: tests

# The suite is offline by design: no dsh instance, no network, no model quota.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # A red check that nobody can read is not a signal. Job logs need repo admin, so the failing test
      # names are also emitted as check annotations - those are readable through the public Checks API,
      # which is how a maintainer without a token finds out what broke.
      - name: npm test
        shell: bash
        run: |
          set +e
          npm test > test.log 2>&1
          code=$?
          cat test.log
          if [ "$code" -ne 0 ]; then
            echo "::error::npm test exited $code on ${{ matrix.os }}, node ${{ matrix.node }}"
            grep -E "^not ok|^# fail" test.log | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          exit "$code"
